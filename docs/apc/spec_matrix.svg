' font-family='Inter,-apple-system,Segoe UI,sans-serif'>n=4</text><text x='86' y='84' font-size='10.5' fill='#a33' text-anchor='start' font-weight='normal' font-family='Inter,-apple-system,Segoe UI,sans-serif'>spec pays 4-8x a decode step per round (chunk-256 DeltaNet + MMA-prefill attention on ~9-col chains):</text><text x='86' y='98' font-size='10.5' fill='#a33' text-anchor='start' font-weight='normal' font-family='Inter,-apple-system,Segoe UI,sans-serif'>accepted tokens (2.8-8.7/round) never cover the wave cost -> ships OFF by default, kernel follow-up scoped</text></svg>