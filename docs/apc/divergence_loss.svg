<svg xmlns='http://www.w3.org/2000/svg' width='940' height='330' viewBox='0 0 940 330'><rect width='940' height='330' fill='#ffffff'/><text x='20' y='30' font-size='17' fill='#1a1a1a' text-anchor='start' font-weight='bold' font-family='Inter,-apple-system,Segoe UI,sans-serif'>The honest loss: mid-context divergence at 20k inside a 33.5k prefix</text><text x='20' y='50' font-size='11' fill='#666' text-anchor='start' font-weight='normal' font-family='Inter,-apple-system,Segoe UI,sans-serif'>request shares only the first 20k tokens with the cached session and the junction was never adjacent in admission order</text><text x='40' y='90' font-size='12.5' fill='#1a1a1a' text-anchor='start' font-weight='bold' font-family='Inter,-apple-system,Segoe UI,sans-serif'>vLLM dense align &#8212; reuse to divergence block</text><rect x='40.0' y='98.0' width='217.6' height='22.0' fill='#9a9a9a' rx='3' opacity='1.0'/><text x='267.6119402985074' y='114' font-size='11.5' fill='#666' text-anchor='start' font-weight='normal' font-family='Inter,-apple-system,Segoe UI,sans-serif'>~13.5k tok recompute (&#8776;1.9s)</text><text x='40' y='158' font-size='12.5' fill='#1a1a1a' text-anchor='start' font-weight='bold' font-family='Inter,-apple-system,Segoe UI,sans-serif'>ours, FIRST unseen junction &#8212; no boundary at 20k</text><rect x='40.0' y='166.0' width='540.0' height='22.0' fill='#d64545' rx='3' opacity='1.0'/><text x='590.0' y='182' font-size='11.5' fill='#d64545' text-anchor='start' font-weight='normal' font-family='Inter,-apple-system,Segoe UI,sans-serif'>33.5k tok recompute (4.6s) &#8212; the loss</text><text x='40' y='226' font-size='12.5' fill='#1a1a1a' text-anchor='start' font-weight='bold' font-family='Inter,-apple-system,Segoe UI,sans-serif'>ours, junction seen once (LCP save) &#8212; every next request</text><rect x='40.0' y='234.0' width='8.0' height='22.0' fill='#3d9b62' rx='3' opacity='1.0'/><text x='58' y='250' font-size='11.5' fill='#3d9b62' text-anchor='start' font-weight='normal' font-family='Inter,-apple-system,Segoe UI,sans-serif'>8 tok (0.07s)</text><text x='40' y='305' font-size='10' fill='#999' text-anchor='start' font-weight='normal' font-family='Inter,-apple-system,Segoe UI,sans-serif'>mitigation shipped: _ck_targets LCP tracking caches any junction after ONE co-occurrence; structural gap remains only for never-adjacent divergence patterns</text></svg>